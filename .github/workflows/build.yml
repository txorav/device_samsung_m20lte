name: AERA Recovery Build (m20lte)

on:
  workflow_dispatch:
    inputs:
      makefile:
        description: 'Lunch target'
        required: false
        default: 'twrp_m20lte-bp2a-eng'
      build_target:
        description: 'Make target'
        required: false
        default: 'adbd recoveryimage'
      aera_branch:
        description: 'AERA manifest branch'
        required: false
        default: 'aera-16.0'
      jobs:
        description: 'Parallel make jobs'
        required: false
        default: '4'
      ccache:
        description: 'Use ccache (true/false)'
        required: false
        default: 'true'
      publish_release:
        description: 'Create a GitHub release with the image'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - fox_12.1
      - fox_11.0
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  AERA_MANIFEST_URL: 'https://github.com/AERA-Recovery/android_manifest.git'
  AERA_MANIFEST_BRANCH: ${{ github.event.inputs.aera_branch || 'aera-16.0' }}
  SRC_DIR: 'aosp'
  AERA_PRODUCT_PREFIX: 'AERA'
  AERA_BUILD_DEVICE: 'm20lte'
  AERA_BUILD_TYPE: 'Beta'
  AERA_BUILD_STATUS: 'Unofficial'
  AERA_MAINTAINER: 'txorav'
  OF_MAINTAINER: 'txorav'
  CCACHE_DIR: '${{ github.workspace }}/.ccache'

jobs:
  build:
    name: Build AERA Recovery for Samsung Galaxy M20 (m20lte)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          path: device_repo
          fetch-depth: 1

      - name: Show parameters & environment
        run: |
          echo "AERA Manifest  : $AERA_MANIFEST_URL @ $AERA_MANIFEST_BRANCH"
          echo "Lunch target   : ${{ inputs.makefile || 'twrp_m20lte-bp2a-eng' }}"
          echo "Build target   : ${{ inputs.build_target || 'adbd recoveryimage' }}"
          echo "Jobs           : ${{ inputs.jobs || '4' }}"
          echo "Free disk space before:"
          df -h /

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache \
                    /usr/local/share/boost /usr/share/swift /opt/microsoft \
                    /usr/local/.ghcup /usr/local/share/powershell \
                    /usr/local/aws-cli /usr/local/aws-sam-cli /usr/lib/mono \
                    /usr/share/java /opt/google /usr/local/julia* \
                    /usr/local/share/chromium /usr/local/share/vcpkg || true
          sudo docker system prune -af --volumes 2>/dev/null || true
          sudo rm -rf /var/lib/docker/* 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison ccache curl flex git git-lfs gnupg patch \
            gcc-multilib g++-multilib \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lz4 pngcrush python3 rsync schedtool squashfs-tools unzip \
            xz-utils zip zlib1g-dev openjdk-17-jdk-headless jq lzma liblzma-dev uuid-runtime
          sudo ln -sf /usr/bin/python3 /usr/bin/python 2>/dev/null || true
          java -version 2>&1

      - name: Set JDK 17
        run: |
          if [ -d "$JAVA_HOME_17_X64" ]; then
            J="$JAVA_HOME_17_X64"
          elif [ -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java ]; then
            J=/usr/lib/jvm/java-17-openjdk-amd64
          else
            J=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          fi
          echo "JAVA_HOME=$J" >> "$GITHUB_ENV"
          "$J/bin/java" -version 2>&1

      - name: Configure swap memory & system settings
        run: |
          # Disable systemd-oomd to prevent premature SIGTERM (exit 143) on memory pressure
          sudo systemctl stop systemd-oomd 2>/dev/null || true
          sudo systemctl disable systemd-oomd 2>/dev/null || true

          # Configure 32G swap for heavy AOSP/Soong compilation
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 32G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=30
          swapon --show
          free -h

      - name: Install repo launcher & configure git
        run: |
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Restore ccache
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-aera-m20lte-${{ github.run_id }}
          restore-keys: |
            ccache-aera-m20lte-

      - name: Configure ccache
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M 8G
          ccache --zero-stats || true

      - name: Pre-download Magisk
        run: |
          mkdir -p "$HOME/Magisk"
          curl -fsSL -o "$HOME/Magisk/Magisk.zip" "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk" || true
          ls -lh "$HOME/Magisk/Magisk.zip" || true

      - name: Sync AERA Recovery sources
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/$SRC_DIR"
          cd "$GITHUB_WORKSPACE/$SRC_DIR"
          repo init --depth=1 -u "$AERA_MANIFEST_URL" -b "$AERA_MANIFEST_BRANCH"
          repo sync -c --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune -j4

      - name: Install device tree
        run: |
          set -e
          mkdir -p "$SRC_DIR/device/samsung/m20lte"
          rsync -av --exclude=".git" --exclude=".github" device_repo/ "$SRC_DIR/device/samsung/m20lte/"
          ls -la "$SRC_DIR/device/samsung/m20lte"

      - name: Install LineageOS mkbootimg (for Samsung Exynos --dt support)
        run: |
          set -e
          rm -rf "$SRC_DIR/system/tools/mkbootimg"
          git clone --depth=1 -b lineage-22.2 https://github.com/LineageOS/android_system_tools_mkbootimg "$SRC_DIR/system/tools/mkbootimg" || \
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_system_tools_mkbootimg "$SRC_DIR/system/tools/mkbootimg"
          echo "LineageOS mkbootimg installed successfully."

      - name: Trim source tree & prune non-recovery projects for Soong
        run: |
          cd "$SRC_DIR"
          echo "Disk space before pruning:"
          df -h /

          # Delete heavy non-recovery projects that are not needed by recovery
          rm -rf cts platform_testing developers development test tools/tradefederation tools/test pdk

          # In frameworks/base, delete root .bp files (which declare framework.jar & Java aconfig host flags) and ignore all subdirectories except libs
          if [ -d "frameworks/base" ]; then
            rm -f frameworks/base/*.bp
            for d in frameworks/base/*; do
              if [ -d "$d" ] && [ "$(basename "$d")" != "libs" ]; then
                touch "$d/.find-ignore"
              fi
            done
            if [ -d "frameworks/base/libs" ]; then
              for d in frameworks/base/libs/*; do
                if [ -d "$d" ] && [ "$(basename "$d")" != "androidfw" ]; then
                  touch "$d/.find-ignore"
                fi
              done
            fi
            [ -d "frameworks/base/libs/androidfw/tests" ] && touch "frameworks/base/libs/androidfw/tests/.find-ignore"
            [ -d "frameworks/base/libs/androidfw/fuzz" ] && touch "frameworks/base/libs/androidfw/fuzz/.find-ignore"
            
            # Patch androidfw to eliminate unused backup_flags aconfig dependency
            if [ -f "frameworks/base/libs/androidfw/BackupHelpers.cpp" ]; then
              sed -i 's|#include <com_android_server_backup.h>||g' frameworks/base/libs/androidfw/BackupHelpers.cpp
              sed -i 's|namespace backup_flags = com::android::server::backup;|namespace backup_flags { inline bool enable_max_size_writes_to_pipes() { return true; } }|g' frameworks/base/libs/androidfw/BackupHelpers.cpp
              echo "Patched BackupHelpers.cpp"
            fi
            if [ -f "frameworks/base/libs/androidfw/Android.bp" ]; then
              python3 -c "
p = 'frameworks/base/libs/androidfw/Android.bp'
c = open(p).read()
import re
c = re.sub(r'cc_aconfig_library\s*\{[^}]*\}', '', c)
c = c.replace('\"backup_flags_cc_lib\",', '')
open(p, 'w').write(c)
"
              echo "Patched androidfw/Android.bp"
            fi
            echo "Pruned frameworks/base (kept only libs/androidfw)"
          fi

          # Prune other non-recovery frameworks and packages
          for d in frameworks/opt frameworks/ex frameworks/layoutlib frameworks/multidex frameworks/libs packages/apps packages/providers packages/screensavers packages/wallpapers packages/services packages/inputmethods art/test kernel/tests device/amlogic device/google device/linaro device/generic/car device/generic/goldfish device/generic/goldfish-opengl device/generic/trusty device/generic/x86 device/generic/x86_64; do
            if [ -d "$d" ]; then
              touch "$d/.find-ignore"
              echo "Added .find-ignore to $d"
            fi
          done

          # Prune all remaining unit tests/fuzzers across the source tree (excluding build, recovery, lvgl, and device tree)
          find . -maxdepth 6 -type d \( -name "tests" -o -name "test" -o -name "testing" -o -name "fuzz" \) \
            -not -path "./build/*" \
            -not -path "./bootable/recovery/*" \
            -not -path "./external/lvgl/*" \
            -not -path "./device/samsung/m20lte/*" \
            -exec touch {}/.find-ignore \; 2>/dev/null || true

          # Prune git packs in prebuilts to save space
          find prebuilts -maxdepth 6 -type d -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          find .repo/project-objects -type d -name '*.git' -prune -exec rm -rf {} + 2>/dev/null || true

          echo "Disk space after pruning:"
          df -h /

      - name: Compile AERA Recovery
        env:
          USE_CCACHE: ${{ inputs.ccache || 'true' }}
          ALLOW_MISSING_DEPENDENCIES: 'true'
          BUILD_JOBS: ${{ inputs.jobs || '4' }}
          MAKEFILE_NAME: ${{ inputs.makefile || 'twrp_m20lte-bp2a-eng' }}
          BUILD_TARGET: ${{ inputs.build_target || 'adbd recoveryimage' }}
          BUILD_USERNAME: ${{ github.actor }}
          BUILD_HOSTNAME: aera-builder
          AERA_PRODUCT_PREFIX: AERA
          AERA_BUILD_DEVICE: m20lte
          AERA_BUILD_TYPE: Beta
          AERA_BUILD_STATUS: Unofficial
          AERA_MAINTAINER: txorav
          OF_MAINTAINER: txorav
          AERA_CURRENT_DEV_STR: '2026-10-27 (aera-16.0)'
        run: |
          cd "$SRC_DIR"
          set -o pipefail
          : > build.log

          LUNCH_TARGET="$MAKEFILE_NAME"
          if [[ "$LUNCH_TARGET" == *"-eng" && "$LUNCH_TARGET" != *"-"*"-eng" ]]; then
            PROD=$(echo "$LUNCH_TARGET" | cut -d'-' -f1)
            LUNCH_TARGET="${PROD}-bp2a-eng"
          elif [[ "$LUNCH_TARGET" == *"-userdebug" && "$LUNCH_TARGET" != *"-"*"-userdebug" ]]; then
            PROD=$(echo "$LUNCH_TARGET" | cut -d'-' -f1)
            LUNCH_TARGET="${PROD}-bp2a-userdebug"
          fi
          echo "Resolved lunch target: $LUNCH_TARGET"

          set +e
          source build/envsetup.sh >> build.log 2>&1
          ENVSETUP_RC=$?
          set -e
          echo "envsetup finished with exit code ${ENVSETUP_RC}"
          tail -n 20 build.log || true
          if [ -z "$ANDROID_BUILD_TOP" ]; then
            echo "::error::envsetup did not initialise ANDROID_BUILD_TOP"
            exit 1
          fi

          set +e
          lunch "$LUNCH_TARGET" >> build.log 2>&1
          LUNCH_RC=$?
          set -e
          tail -n 30 build.log || true
          if [ "$LUNCH_RC" -ne 0 ] || [ -z "$TARGET_PRODUCT" ]; then
            echo "::error::lunch failed or did not export TARGET_PRODUCT"
            exit 1
          fi
          export TARGET_PRODUCT TARGET_BUILD_VARIANT TARGET_BUILD_TYPE

          # Start background heartbeat to prevent GitHub Actions 20-min silence timeout
          ( while true; do sleep 60; echo "[HEARTBEAT $(date +'%H:%M:%S')] Mem: $(free -h | awk '/Mem:/ {print $3 "/" $2}') | Swap: $(free -h | awk '/Swap:/ {print $3 "/" $2}') | Disk: $(df -h / | awk 'NR==2 {print $4}') free"; done ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT

          mka -j"$BUILD_JOBS" $BUILD_TARGET 2>&1 | tee -a build.log
          BUILD_RC=${PIPESTATUS[0]}

          kill $HEARTBEAT_PID 2>/dev/null || true
          trap - EXIT

          if [ $BUILD_RC -ne 0 ]; then
            echo "::error::mka failed with exit code $BUILD_RC"
            tail -n 60 build.log || true
            exit 1
          fi

      - name: Package Odin Tar & Checksums
        if: success()
        run: |
          OUT_DIR="$SRC_DIR/out/target/product/m20lte"
          if [ -d "$OUT_DIR" ]; then
            cd "$OUT_DIR"
            if [ -f "recovery.img" ]; then
              echo "Packaging Odin tar archives for recovery.img..."
              tar -H ustar -c recovery.img > recovery.tar
              cp -f recovery.tar recovery.tar.md5
              md5sum -t recovery.tar.md5 >> recovery.tar.md5
              md5sum recovery.img > recovery.img.md5
              sha256sum recovery.img > recovery.img.sha256
            fi
            for img in AERA-*.img; do
              if [ -f "$img" ]; then
                base="${img%.img}"
                echo "Packaging Odin tar archive for $img..."
                tar -H ustar -c "$img" > "${base}.tar"
                cp -f "${base}.tar" "${base}.tar.md5"
                md5sum -t "${base}.tar.md5" >> "${base}.tar.md5"
                md5sum "$img" > "${img}.md5"
                sha256sum "$img" > "${img}.sha256"
              fi
            done
            for zip in AERA-*.zip; do
              if [ -f "$zip" ]; then
                md5sum "$zip" | awk '{print $1}' > "${zip}.md5"
                sha256sum "$zip" | awk '{print $1}' > "${zip}.sha256"
              fi
            done
            cd "$GITHUB_WORKSPACE"
            ls -lh "$OUT_DIR"
          fi

      - name: Show ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aera-m20lte-build-log
          path: |
            ${{ env.SRC_DIR }}/build.log
            ${{ env.SRC_DIR }}/out/soong.log
            ${{ env.SRC_DIR }}/out/error.log
          if-no-files-found: ignore

      - name: Upload recovery artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aera-m20lte-recovery
          path: |
            ${{ env.SRC_DIR }}/out/target/product/m20lte/AERA-*
            ${{ env.SRC_DIR }}/out/target/product/m20lte/recovery.*
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.event.inputs.publish_release == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SRC_DIR }}/out/target/product/m20lte/AERA-*
            ${{ env.SRC_DIR }}/out/target/product/m20lte/recovery.*
          generate_release_notes: true

      - name: Upload Artifacts to Gofile & Notify Telegram
        if: always()
        continue-on-error: true
        env:
          GOFILE_TOKEN: 'IoC222lPjhLcrkCYcgVLdo7OkQRDW201'
          TELEGRAM_BOT_TOKEN: '8477945979:AAGTYiUAfnPjQFpkh576D7Xsqm0RDQJr_As'
          TELEGRAM_CHAT_ID: '8198896729'
          JOB_STATUS: ${{ job.status }}
          RECOVERY_FLAVOR: 'AERA'
        run: |
          python3 - << 'EOF'
          import os, glob, hashlib, json, subprocess, urllib.request

          flavor = os.environ.get("RECOVERY_FLAVOR", "AERA")
          status = os.environ.get("JOB_STATUS", "failure")
          gofile_token = os.environ.get("GOFILE_TOKEN", "")
          tg_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          tg_chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          src_dir = os.environ.get("SRC_DIR", "aosp")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          sha = os.environ.get("GITHUB_SHA", "")[:7]
          branch = os.environ.get("GITHUB_REF_NAME", "fox_12.1")

          def send_tg(text):
              if not tg_token or not tg_chat: return
              data = json.dumps({
                  "chat_id": tg_chat,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True
              }).encode("utf-8")
              req = urllib.request.Request(f"https://api.telegram.org/bot{tg_token}/sendMessage", data=data, headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r: pass
              except Exception as e: print("Telegram send error:", e)

          if status != "success":
              fail_msg = f"❌ <b>{flavor} Build Failed!</b>\n\n📱 <b>Device:</b> Samsung Galaxy M20 (<code>m20lte</code>)\n🌿 <b>Branch:</b> {branch}\n🔖 <b>Commit:</b> <a href=\"https://github.com/{repo}/commit/{sha}\">{sha}</a>\n⏱ <b>Logs:</b> <a href=\"https://github.com/{repo}/actions/runs/{run_id}\">View Failed Run</a>"
              send_tg(fail_msg)
              exit(0)

          target_dir = f"{src_dir}/out/target/product/m20lte"
          files = sorted(glob.glob(f"{target_dir}/AERA-*.zip") + glob.glob(f"{target_dir}/AERA-*.tar") + glob.glob(f"{target_dir}/*.zip") + glob.glob(f"{target_dir}/*.tar") + glob.glob(f"{target_dir}/recovery.img"))
          # Deduplicate while preserving order
          seen = set()
          unique_files = []
          for f in files:
              if f not in seen and not f.endswith(".md5") and not f.endswith(".sha256"):
                  seen.add(f)
                  unique_files.append(f)
          files = unique_files

          if not files:
              send_tg(f"⚠️ <b>{flavor} Build Succeeded</b> but no recovery artifacts were found in {target_dir}.\n⏱ Run: <a href=\"https://github.com/{repo}/actions/runs/{run_id}\">#{run_id}</a>")
              exit(0)

          try:
              req = urllib.request.Request("https://api.gofile.io/servers", headers={"Authorization": f"Bearer {gofile_token}"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  sdata = json.loads(r.read().decode("utf-8"))
                  servers = [s.get("name") for s in sdata.get("data", {}).get("servers", []) if s.get("name")]
          except Exception:
              servers = ["store-na-phx-1", "store6", "store3", "store1"]
          if not servers:
              servers = ["store-na-phx-1", "store6", "store3"]

          links = []
          for f in files:
              fname = os.path.basename(f)
              fsize = f"{os.path.getsize(f) / (1024*1024):.1f}MB"
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()[:16]
              
              dl = None
              for srv in servers:
                  print(f"Uploading {fname} ({fsize}) to Gofile server {srv}...")
                  cmd = f'curl -sSL --http1.1 --connect-timeout 30 --max-time 600 -X POST "https://{srv}.gofile.io/contents/uploadfile" -H "Authorization: Bearer {gofile_token}" -F "file=@{f}"'
                  try:
                      res = subprocess.run(cmd, shell=True, stdout=subprocess.PIPE, text=True, timeout=660)
                      if res.stdout:
                          j = json.loads(res.stdout)
                          dl = j.get("data", {}).get("downloadPage")
                          if dl:
                              print(f"Uploaded {fname} -> {dl}")
                              break
                  except Exception as e:
                      print(f"Gofile server {srv} failed: {e}")

              lb_dl = None
              try:
                  print(f"Uploading {fname} to Litterbox mirror...")
                  lb_cmd = f'curl -sSL --http1.1 --connect-timeout 30 --max-time 600 -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@{f}" https://litterbox.catbox.moe/resources/internals/api.php'
                  lb_res = subprocess.run(lb_cmd, shell=True, stdout=subprocess.PIPE, text=True, timeout=660).stdout.strip()
                  if lb_res.startswith("http"):
                      lb_dl = lb_res
                      print(f"Litterbox uploaded: {lb_dl}")
              except Exception as e:
                  print(f"Litterbox failed: {e}")

              mirror_links = []
              if dl:
                  mirror_links.append(f'📂 <a href="{dl}">Gofile</a>')
              if lb_dl:
                  mirror_links.append(f'⚡ <a href="{lb_dl}">Litterbox (Direct)</a>')
              
              if mirror_links:
                  links.append(f"📦 <b>{fname}</b> ({fsize})\n" + " | ".join(mirror_links) + f"\n🔑 <code>{h}...</code>")
              else:
                  links.append(f"⚠️ <b>{fname}</b> ({fsize}) - Upload error")

          msg = f"🎉 <b>{flavor} Build Completed!</b>\n\n📱 <b>Device:</b> Samsung Galaxy M20 (<code>m20lte</code>)\n🌿 <b>Branch:</b> {branch}\n🔖 <b>Commit:</b> <a href=\"https://github.com/{repo}/commit/{sha}\">{sha}</a>\n⏱ <b>Run:</b> <a href=\"https://github.com/{repo}/actions/runs/{run_id}\">View on GitHub Actions</a>\n\n" + "\n\n".join(links) + "\n\n🚀 <i>Ready to flash via Odin, Heimdall, fastboot, or recovery!</i>"
          send_tg(msg)
          print("Notification sent successfully!")
          EOF
